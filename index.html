<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Oh! Café - Café de Especialidad en Comayagua, Honduras. Tapas, crepes y el mejor café artesanal.">
  <title>Oh! Café | Café de Especialidad - Comayagua, Honduras</title>
  
  <!-- Preconnect to Google Fonts for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Fonts will be loaded dynamically via JavaScript based on config -->
  <link id="google-fonts-link" rel="stylesheet" href="">
  
  <link rel="stylesheet" href="styles.css">
  
  <!-- Load config first, then main script -->
  <script src="config.js"></script>
</head>
<body>
  
  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container nav-container">
      <a href="#" class="logo" id="logo-link">
        <span class="logo-text" id="logo-text"></span>
      </a>
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#hero" class="nav-link">Home</a></li>
        <li><a href="#about" class="nav-link">About</a></li>
        <li><a href="#menu" class="nav-link">Menu</a></li>
        <li><a href="#gallery" class="nav-link">Gallery</a></li>
        <li><a href="#location" class="nav-link">Location</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero" id="hero">
    <div class="hero-image" id="hero-image"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-headline" id="hero-headline"></h1>
      <p class="hero-subheadline" id="hero-subheadline"></p>
      <a href="#menu" class="btn btn-primary" id="hero-cta"></a>
    </div>
  </section>

  <!-- About Section -->
  <section class="about section" id="about">
    <div class="container">
      <div class="about-grid">
        <div class="about-content fade-in">
          <h2 class="section-title" id="about-title"></h2>
          <p class="about-text" id="about-text"></p>
        </div>
        <div class="about-image-wrapper fade-in">
          <img src="" alt="About our coffee shop" class="about-image" id="about-image" loading="lazy">
        </div>
      </div>
    </div>
  </section>

  <!-- Menu Section -->
  <section class="menu section" id="menu">
    <div class="container">
      <h2 class="section-title center">Our Menu</h2>
      <div class="menu-grid" id="menu-grid">
        <!-- Menu categories will be inserted here by JavaScript -->
      </div>
    </div>
  </section>

  <!-- Gallery Section -->
  <section class="gallery section" id="gallery">
    <div class="container">
      <h2 class="section-title center">Gallery</h2>
      <div class="gallery-grid" id="gallery-grid">
        <!-- Gallery images will be inserted here by JavaScript -->
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close lightbox">&times;</button>
    <button class="lightbox-prev" id="lightbox-prev" aria-label="Previous image">&lsaquo;</button>
    <button class="lightbox-next" id="lightbox-next" aria-label="Next image">&rsaquo;</button>
    <img src="" alt="Gallery image" class="lightbox-image" id="lightbox-image">
  </div>

  <!-- Testimonials Section -->
  <section class="testimonials section">
    <div class="container">
      <h2 class="section-title center">What People Say</h2>
      <div class="testimonials-grid" id="testimonials-grid">
        <!-- Testimonials will be inserted here by JavaScript -->
      </div>
    </div>
  </section>

  <!-- Hours & Location Section -->
  <section class="location section" id="location">
    <div class="container">
      <h2 class="section-title center">Visit Us</h2>
      <div class="location-grid">
        <div class="location-info fade-in">
          <div class="info-block">
            <h3>Hours</h3>
            <table class="hours-table" id="hours-table">
              <!-- Hours will be inserted here by JavaScript -->
            </table>
          </div>
          <div class="info-block">
            <h3>Find Us</h3>
            <p class="contact-item">
              <strong>Address:</strong><br>
              <a href="#" id="address-link" target="_blank" rel="noopener"></a>
            </p>
            <p class="contact-item">
              <strong>Phone:</strong><br>
              <a href="" id="phone-link"></a>
            </p>
            <p class="contact-item">
              <strong>Email:</strong><br>
              <a href="" id="email-link"></a>
            </p>
          </div>
        </div>
        <div class="map-wrapper fade-in">
          <iframe 
            id="map-embed"
            src="" 
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade"
            title="Coffee shop location map">
          </iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Banner -->
  <section class="cta-banner">
    <div class="container cta-content">
      <h2 id="cta-headline"></h2>
      <p id="cta-subheadline"></p>
      <a href="#location" class="btn btn-light" id="cta-button"></a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div class="footer-social">
        <a href="" id="instagram-link" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
        <a href="" id="facebook-link" target="_blank" rel="noopener" aria-label="Facebook">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
      </div>
      <p class="footer-text">
        &copy; <span id="current-year"></span> <span id="footer-shop-name"></span>. All rights reserved.
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
